name: CI

# Every push and pull request is type-checked, built and tested (unit, real-WireMock container tests on
# Redis, SQLite and WireMock-only, and end-to-end in Chromium). Both Docker images (UI only, and standalone with
# WireMock inside) are built and smoke-tested every time, and published to GitHub Container Registry for
# linux/amd64 and linux/arm64 only for version tags (v1.2.3) once every test job passed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Docker image runs Node 22 (Dockerfile); test on the same major.
  NODE_VERSION: '22'
  LOG_LEVEL: silent
  # Testcontainers: GitHub's hosted runners have Docker; the reaper is fine there.
  TESTCONTAINERS_RYUK_DISABLED: 'false'

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # No install scripts: the project has no native modules (pure-JS dependencies only).
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build

  test:
    name: Unit and container tests
    runs-on: ubuntu-latest
    # The full run takes about 15 minutes locally; container start-up on hosted runners varies.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      # Pull the images the container tests use once, up front, so test timeouts don't include downloads.
      - name: Pull test images
        run: |
          docker pull wiremock/wiremock:3.13.1
          docker pull redis:7.4-alpine
      - name: Vitest (server on Redis, SQLite and WireMock-only; UI)
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vitest-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: docker pull wiremock/wiremock:3.13.1
      - name: Playwright
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-none:
    name: End-to-end, WireMock-only mode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: docker pull wiremock/wiremock:3.13.1
      # STORE_DRIVER=none against a WireMock that already has stubs: nothing is added or deleted behind the user's back.
      - run: scripts/e2e-none.sh

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, test, e2e, e2e-none]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # arm64 images are built under emulation; the build stages run on the runner's own platform, so only the
      # short final stages are emulated.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Image tags (UI only)
        id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Image tags (standalone, UI and WireMock)
        id: meta-standalone
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-standalone,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Sign in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every run builds both images for the runner (amd64) into the local engine and smoke-tests them; version tags
      # then push amd64 + arm64 builds of the same Dockerfile (the amd64 layers come from the cache).
      - name: Build (UI only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          load: true
          tags: wiremock-ui:ci
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - name: Smoke test (UI only, against a WireMock container)
        run: scripts/docker-smoke.sh wiremock-ui:ci
      - name: Build (standalone)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          load: true
          tags: wiremock-ui:ci-standalone
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone
      - name: Smoke test (standalone)
        run: scripts/docker-smoke-standalone.sh wiremock-ui:ci-standalone
      - name: Push UI only (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha,scope=ui
      - name: Push standalone (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          target: standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-standalone.outputs.tags }}
          labels: ${{ steps.meta-standalone.outputs.labels }}
          cache-from: type=gha,scope=standalone
